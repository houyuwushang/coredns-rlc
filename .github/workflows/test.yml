name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.27.x']
        include:
          - os: ubuntu-latest
            go: '1.26.x'
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race -count=1 -timeout=5m ./...
      - run: go vet ./...
      - run: go build ./cmd/coredns-rlc
  full-coredns:
    name: Full CoreDNS plugin.cfg build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.x'
      - name: Check formatting and fuzz parsers
        run: |
          test -z "$(gofmt -l .)"
          go test -run '^$' -fuzz '^FuzzReverseAddress$' -fuzztime 10s -parallel 2
          go test -run '^$' -fuzz '^FuzzReverseMalformed$' -fuzztime 10s -parallel 2
      - name: Build the external plugin into CoreDNS v1.15.0
        run: |
          git clone --depth 1 --branch v1.15.0 https://github.com/coredns/coredns.git "$RUNNER_TEMP/coredns"
          cd "$RUNNER_TEMP/coredns"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('plugin.cfg')
          s = p.read_text()
          assert s.count('cache:cache\n') == 1
          p.write_text(s.replace('cache:cache\n', 'rlc:github.com/houyuwushang/coredns-rlc\ncache:cache\n'))
          PY
          go mod edit -replace "github.com/houyuwushang/coredns-rlc=$GITHUB_WORKSPACE"
          go mod edit -require github.com/houyuwushang/coredns-rlc@v0.0.0
          go generate
          go mod tidy
          go build -o coredns .
          ./coredns -plugins > plugins.txt
          python3 -c "from pathlib import Path; assert 'rlc' in Path('plugins.txt').read_text().splitlines()"
